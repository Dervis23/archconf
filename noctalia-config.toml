[bar]
order = [ "ustbar" ]

    [bar.ustbar]
    background_opacity = 0.52999998815357685
    capsule = true
    capsule_border_width = 0.0
    capsule_fill = "outline"
    capsule_opacity = 0.79999998211860657
    capsule_padding = 5.0
    capsule_radius = 4
    center = [ "clock", "media" ]
    end = [ "tray", "network_rx", "notifications", "clipboard", "volume", "session" ]
    font_family = "JetBrainsMono Nerd Font"
    icon_color = "primary"
    margin_edge = 5
    margin_ends = 70
    padding = 4
    panel_overlap = 3
    radius = 8
    start = [ "control-center", "workspaces", "active_window" ]
    widget_spacing = 4

[calendar]

[control_center]
hidden_tabs = [ "bluetooth" ]
width = 650

    [control_center.calendar]
    show_events_card = false

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "screen_time"

    [[control_center.shortcuts]]
    type = "yocraft/custom-shortcut:shortcut"

[dock]
background_opacity = 0.76999998278915882
border_width = 1.5
cross_axis_padding = 2
icon_size = 34
inactive_opacity = 0.70999998413026333
item_spacing = 0
magnification_scale = 1.2000000029802322
main_axis_padding = 1
margin_edge = 7
radius = 10
reserve_space = false
show_dots = true
smart_auto_hide = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 680.0
    cy = 586.0
    output = "HDMI-A-1"
    placement_height = 768.0
    placement_width = 1360.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."alexander/screen-toolkit"]
selected-ocr-lang = "tur"

[plugin_settings."yocraft/custom-shortcut"]
icon = "brand-youtube-filled"
label = "Music"
onclick_cmd = "noctalia msg panel-toggle aabidk20/yt-music:panel"

[plugins]
enabled = [ "yocraft/custom-shortcut", "aabidk20/yt-music" ]

[shell]
avatar_path = "/home/gauss/Resimler/4961x3508_nordic_ign_unsplash50.jpg"
corner_radius_scale = 0.80000001192092896
font_family = "Adwaita Sans"
lang = "tr"
screen_time_enabled = true

    [shell.launcher]
    app_grid = true
    categories = false
    compact = true
    fetch_exchange_rates = false

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "floating"

    [shell.screenshot]
    confirm_region = true

    [shell.session]
    grid = true

[theme]
builtin = "Kanagawa"
community_palette = "Everforest Material"
mode = "dark"
shell_mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty" ]
    community_ids = [ "micro", "papirus-icons", "yazi" ]

[wallpaper]
directory = "/home/gauss/Resimler/Duvarkağıdı"

    [wallpaper.default]
    path = "/home/gauss/Resimler/Duvarkağıdı/1920x1080_digital_a_foggy_forest_with_trees_and_bushes.jpg"

    [wallpaper.last]
    path = "/home/gauss/Resimler/Duvarkağıdı/1920x1080_digital_a_foggy_forest_with_trees_and_bushes.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/gauss/Resimler/Duvarkağıdı/1920x1080_digital_a_foggy_forest_with_trees_and_bushes.jpg"

[widget.active_window]
display = "text_only"
max_length = 198
title_scroll = "on_hover"

[widget.clock.actions]
middle = "none"
right = "exec noctalia msg panel-toggle aabidk20/yt-music:panel"

[widget.control-center]
glyph = "navigation"

[widget.media]
hide_when_no_media = true
max_length = 180
title_scroll = "on_hover"

    [widget.media.actions]
    middle = "exec noctalia msg panel-toggle aabidk20/yt-music:panel"
    right = "exec noctalia msg panel-toggle aabidk20/yt-music:panel"

[widget.network]
vpn_status = "hidden"

[widget.volume.actions]
middle = "exec pavucontrol"
